<title>Victory Sync Industry Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a live "call desk". Every page opens on a real call being handled, then proves it with the transcript, the routing rules, and the caller's own numbers. */
:root{
  --bg:#0A0F1E; --bg-2:#0E1428; --bg-3:#131B36;
  --glass:rgba(140,150,255,.05); --glass-2:rgba(140,150,255,.09);
  --line:rgba(170,180,255,.12); --line-2:rgba(170,180,255,.22);
  --fg:#EEF0FA; --muted:#9AA3C4; --dim:#6B7396;
  --violet:#7B5CF6; --violet-hi:#A996FF; --violet-ink:#FFFFFF;
  --ok:#34D399; --warn:#FBBF24; --hot:#F87171;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--violet-hi);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em}
h2{font-size:clamp(28px,3.6vw,44px);line-height:1.08;font-weight:800}
.lede{color:var(--muted);font-size:18px;max-width:60ch;margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;transition:transform .15s,background .15s,border-color .15s;cursor:pointer}
.btn-primary{background:var(--violet);color:var(--violet-ink);box-shadow:0 10px 30px -10px rgba(123,92,246,.8)}
.btn-primary:hover{background:#8B70FF;transform:translateY(-1px)}
.btn-ghost{border-color:var(--line-2);color:var(--fg)}
.btn-ghost:hover{border-color:var(--violet-hi)}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px}
section{padding-block:clamp(64px,9vw,112px)}
.sec-head{display:grid;gap:14px;margin-bottom:40px;max-width:760px}

/* preview switcher (preview only, not part of the real page) */
.switcher{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#05070F;border-bottom:1px solid var(--line)}
.switcher .wrap{display:flex;gap:12px;align-items:center;padding-block:10px}
.switcher label{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.switcher select{flex:1;min-width:0;background:var(--bg-3);color:var(--fg);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font:500 14px var(--sans)}

/* nav */
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;letter-spacing:-.01em;font-size:18px}
.brand .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#E9EBF6,#B9BED6);box-shadow:inset 0 1px 0 #fff,0 6px 18px -8px rgba(169,150,255,.6)}
.brand .mark img{width:28px;height:auto}
.nav-links{display:flex;gap:26px;align-items:center;font-size:14px;color:var(--muted)}
.nav-links a{text-decoration:none}
.nav-links a:hover{color:var(--fg)}
.nav .btn{padding:11px 18px;font-size:14px}
@media (max-width:820px){.nav-links .hide-sm{display:none}}
@media (max-width:700px){.nav .btn{display:none}}

/* hero */
.hero{padding-block:clamp(36px,6vw,72px) clamp(56px,8vw,96px);position:relative}
.hero::before{content:"";position:absolute;inset:-120px 0 auto;height:620px;background:radial-gradient(600px 340px at 78% 30%,rgba(123,92,246,.28),transparent 70%),radial-gradient(500px 300px at 10% 0%,rgba(52,211,153,.08),transparent 70%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center}
.hero-copy{display:grid;gap:24px;min-width:0}
.hero h1{font-size:clamp(40px,5.6vw,72px);line-height:1.02;font-weight:900}
.hero h1 span{display:block}
.hero h1 span:last-child{color:var(--violet-hi)}
.hero .lede{font-size:clamp(17px,1.5vw,19px)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.phone-txt{font:500 14px var(--mono);color:var(--muted);user-select:all}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{font:500 13px var(--sans);color:var(--muted);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.chip b{color:var(--fg);font-weight:600}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}

/* call console */
.console{position:relative;border-radius:22px;padding:1px;background:linear-gradient(160deg,rgba(169,150,255,.55),rgba(169,150,255,.06) 40%,rgba(52,211,153,.25));min-width:0}
.console-in{border-radius:21px;background:linear-gradient(180deg,rgba(19,27,54,.96),rgba(10,15,30,.98));padding:22px;display:grid;gap:16px;backdrop-filter:blur(12px)}
.con-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:rgba(251,191,36,.12);color:var(--warn);transition:all .3s}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
.status.live{background:rgba(52,211,153,.12);color:var(--ok)}
.status.done{background:rgba(169,150,255,.14);color:var(--violet-hi)}
.status.done i{animation:none}
@keyframes blink{50%{opacity:.25}}
.caller{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line-2);position:relative}
.avatar svg{width:22px;height:22px;color:var(--fg)}
.ring .avatar::after{content:"";position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--warn);opacity:0;animation:ring 1.2s infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.caller-meta{min-width:0}
.caller-name{font-weight:700;font-size:17px}
.caller-line{color:var(--muted);font-size:14px}
.timer{margin-left:auto;font:600 15px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.bubbles{display:grid;gap:8px;min-height:208px;align-content:start}
.bub{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;animation:pop .35s ease both}
.bub.c-caller{background:var(--glass-2);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.bub.c-agent{background:rgba(123,92,246,.18);border:1px solid rgba(169,150,255,.3);justify-self:end;border-bottom-right-radius:4px}
.bub small{display:block;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.typing{justify-self:end;display:flex;gap:4px;padding:12px 14px;border-radius:14px;background:rgba(123,92,246,.12)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--violet-hi);animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{opacity:.2;transform:translateY(-2px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.outcome{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--ok);font-weight:600;font-size:14px;transition:opacity .4s}
.outcome svg{flex:none;width:18px;height:18px}
.outcome.off{opacity:.25;filter:grayscale(1)}

/* leaks */
.leaks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.leak{padding:26px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:grid;gap:10px;align-content:start}
.leak .k{font:600 12px var(--mono);color:var(--hot);letter-spacing:.08em}
.leak h3{font-size:20px;line-height:1.25}
.leak p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:820px){.leaks{grid-template-columns:1fr}}

/* listen in */
.listen{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:start}
.panel{border-radius:var(--r);background:var(--bg-2);border:1px solid var(--line);padding:24px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.replay{background:none;border:1px solid var(--line-2);color:var(--fg);border-radius:999px;padding:7px 14px;font:600 12px var(--mono);letter-spacing:.06em;cursor:pointer;text-transform:uppercase}
.replay:hover{border-color:var(--violet-hi)}
.transcript{display:grid;gap:10px;min-height:300px;align-content:start}
.summary{display:grid;gap:0}
.sum-row{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line);font-size:15px;opacity:.25;transition:opacity .4s}
.sum-row.on{opacity:1}
.sum-row:last-child{border-bottom:0}
.sum-row dt{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-top:3px}
.sum-row dd{margin:0;font-weight:600}
.sum-row:last-child dd{color:var(--ok)}
.sum-foot{margin-top:16px;font-size:13px;color:var(--dim)}
@media (max-width:900px){.listen{grid-template-columns:1fr}}

/* rules */
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:0;padding:6px;border-radius:16px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;transition:border-color .2s,background .2s}
.rule:hover,.rule.on{border-color:rgba(169,150,255,.5);background:rgba(123,92,246,.09)}
.rule .t,.rule .a{padding:16px 18px;border-radius:11px;font-weight:600;font-size:15px;line-height:1.35}
.rule .t{background:var(--bg-2)}
.rule .t small,.rule .a small{display:block;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:600}
.rule .a{background:var(--bg-3)}
.rule.on .a{background:var(--violet);color:#fff}
.rule.on .a small{color:rgba(255,255,255,.75)}
.wire{position:relative;height:2px;background:var(--line-2);margin:0 6px}
.wire::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left:7px solid var(--line-2);border-right:0}
.rule.on .wire{background:linear-gradient(90deg,transparent,var(--violet-hi));background-size:200% 100%;animation:flow 1s linear infinite}
.rule.on .wire::after{border-left-color:var(--violet-hi)}
@keyframes flow{from{background-position:100% 0}to{background-position:-100% 0}}
@media (max-width:640px){.rule{grid-template-columns:1fr}.wire{height:18px;width:2px;margin:4px auto}.wire::after{right:-4px;top:auto;bottom:-3px;border:5px solid transparent;border-top:7px solid var(--line-2);border-bottom:0}.rule.on .wire::after{border-top-color:var(--violet-hi);border-left-color:transparent}}

/* calculator */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
.sliders{display:grid;gap:26px;align-content:start}
.sl label{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;margin-bottom:12px}
.sl label output{font:600 16px var(--mono);color:var(--violet-hi);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--violet);height:6px}
.result{border-radius:var(--r);padding:30px;background:radial-gradient(400px 220px at 80% 0%,rgba(123,92,246,.35),transparent 70%),var(--bg-3);border:1px solid rgba(169,150,255,.3);display:grid;gap:18px;align-content:center}
.result .lab{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:800 clamp(44px,6vw,68px)/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;color:var(--muted);font-weight:600;letter-spacing:0}
.result .sub2{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.result .sub2 b{display:block;color:var(--fg);font:700 20px var(--mono);font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--dim);margin:0}
@media (max-width:900px){.calc{grid-template-columns:1fr}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s;position:relative}
.step{padding:0 22px 0 0;display:grid;gap:10px;align-content:start;position:relative}
.step .n{font:600 13px var(--mono);color:var(--violet-hi);display:flex;align-items:center;gap:10px}
.step .n::after{content:"";flex:1;height:1px;background:var(--line-2)}
.step:last-child .n::after{background:linear-gradient(90deg,var(--line-2),transparent)}
.step h3{font-size:19px}
.step p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr;gap:32px}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* why */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.why div{background:var(--bg);padding:28px;display:grid;gap:8px;align-content:start}
.why .k{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.why h3{font-size:19px}
.why p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:820px){.why{grid-template-columns:1fr}}

/* faq */
.faq{display:grid;gap:10px;max-width:860px}
.faq details{border:1px solid var(--line);border-radius:14px;background:var(--glass);padding:0 20px}
.faq summary{list-style:none;cursor:pointer;padding:20px 0;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:500 22px/1 var(--mono);color:var(--violet-hi);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 20px;color:var(--muted);max-width:70ch}

/* related */
.related{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rel{display:grid;gap:6px;padding:20px;border-radius:14px;border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .2s}
.rel:hover{border-color:var(--violet-hi);transform:translateY(-2px)}
.rel small{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.rel b{font-size:16px}
.rel span{color:var(--violet-hi);font-size:14px;font-weight:600}
@media (max-width:820px){.related{grid-template-columns:1fr}}

/* cta band */
.band{border-radius:28px;padding:clamp(32px,5vw,64px);background:radial-gradient(500px 300px at 85% 20%,rgba(123,92,246,.55),transparent 70%),radial-gradient(400px 260px at 0% 100%,rgba(52,211,153,.14),transparent 70%),var(--bg-3);border:1px solid rgba(169,150,255,.3);display:grid;grid-template-columns:1.4fr auto;gap:28px;align-items:center}
.band h2{font-size:clamp(28px,3.4vw,42px)}
.band p{margin:10px 0 0;color:var(--muted)}
@media (max-width:820px){.band{grid-template-columns:1fr}}

/* compare */
.vs-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.vs-card{padding:22px;border-radius:var(--r);border:1px solid var(--line);background:var(--glass);display:grid;gap:6px}
.vs-card.b{border-color:rgba(169,150,255,.45);background:rgba(123,92,246,.1)}
.vs-card small{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.vs-card b{font-size:20px}
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:16px 20px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:15px}
thead th{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--bg-2)}
thead th:last-child{color:var(--violet-hi)}
tbody th{font-weight:700;width:28%}
tbody td:nth-child(2){color:var(--muted)}
tbody td:last-child{background:rgba(123,92,246,.06)}
tbody tr:last-child>*{border-bottom:0}
.when{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.when .panel h3{font-size:20px;margin-bottom:14px}
.when ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.when li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--muted)}
.when li::before{content:"✓";font:700 14px var(--mono);color:var(--ok)}
.when .panel.b{border-color:rgba(169,150,255,.4)}
@media (max-width:820px){.when,.vs-hero{grid-template-columns:1fr}}

/* footer + sticky */
footer{border-top:1px solid var(--line);padding-block:36px;color:var(--dim);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,15,30,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none}
.sticky .btn{width:100%;justify-content:center}
@media (max-width:700px){.sticky{display:block}footer{padding-bottom:110px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
// Victory Sync SEO pages: content for 10 industry/service pages + 2 comparison pages.
// Rules: no pricing, no em dashes, no made-up statistics. Calculator defaults are examples the visitor edits.
// CTA everywhere: https://consult.victorysync.com

const SITE = {
  name: "Victory Sync",
  url: "https://victorysync.com",
  cta: "https://consult.victorysync.com",
  ctaLabel: "Book a free consultation",
  phone: "(732) 328-6846",
  phoneHref: "tel:+17323286846",
};

const PAGES = [
  // ───────────────────────────── 1
  {
    slug: "answering-service-for-plumbers",
    kind: "service",
    mode: "call",
    industry: "Plumbing",
    title: "Answering Service for Plumbers | Live Answering, 24/7 Booking | Victory Sync",
    description:
      "A live answering service for plumbing companies. Real people answer in your company's name, book jobs on your calendar, and send emergencies straight to your on-call tech.",
    eyebrow: "Answering service for plumbers",
    h1: ["Every burst pipe", "is a booked job.", "If someone picks up."],
    sub: "We answer your plumbing company's phones in your name, nights and weekends included. Emergencies go to your on-call tech. Everything else gets booked on your calendar, and you get a summary of every call.",
    call: { time: "Sun 9:47 PM", caller: "Dana R.", line: "Water's coming through the kitchen ceiling", outcome: "Sent to on-call tech in 40 sec" },
    pains: [
      { t: "You're under a sink when it rings", d: "You can't stop a job to answer. The caller doesn't wait. They hang up and call the next plumber on Google." },
      { t: "Emergencies don't keep office hours", d: "The calls worth the most come in at 10 PM on a Saturday. Voicemail tells them to go somewhere else." },
      { t: "Your office line is a bottleneck", d: "One person answering, scheduling, and chasing invoices means some calls just don't get picked up." },
    ],
    transcript: [
      { who: "agent", text: "Thanks for calling Reliable Plumbing, this is Mariam. What's going on?" },
      { who: "caller", text: "Water is dripping through my kitchen ceiling. I think something upstairs burst." },
      { who: "agent", text: "Okay, first thing: do you know where your main water shutoff is? Let's turn that off while I get you help." },
      { who: "caller", text: "Yeah, it's in the basement. Okay... it's off." },

function nav() {
  return `<header class="nav"><div class="wrap">
    <a class="brand" href="#${PAGES[0].slug}"><span class="mark"><img src="${LOGO}" alt=""></span>Victory Sync</a>
    <nav class="nav-links"><a class="hide-sm" href="#how">How it works</a><a class="hide-sm" href="#faq">FAQ</a>
    <a class="btn btn-primary" href="${SITE.cta}" target="_blank" rel="noopener">${SITE.ctaLabel}</a></nav>
  </div></header>`;
}
function ctaRow() {
  return `<div class="cta-row"><a class="btn btn-primary" href="${SITE.cta}" target="_blank" rel="noopener">${SITE.ctaLabel} ${ICON.arrow}</a>
    <span class="phone-txt">or call ${SITE.phone}</span></div>`;
}
function trust() {
  return `<div class="trust"><span class="chip"><b>Managed in</b> Millstone, NJ</span><span class="chip"><b>One named</b> team owner</span><span class="chip"><b>You approve</b> every script</span></div>`;
}

function consoleCard(p) {
  const isLead = p.mode === "lead";
  return `<div class="console" aria-label="Example of a call being handled"><div class="console-in" id="con">
    <div class="con-top"><span>${isLead ? "New lead" : "Incoming call"} · ${esc(p.call.time)}</span><span class="status" id="st"><i></i><span id="stx">${isLead ? "New lead" : "Ringing"}</span></span></div>
    <div class="caller ring" id="caller"><div class="avatar">${isLead ? ICON.form : ICON.phone}</div>
      <div class="caller-meta"><div class="caller-name">${esc(p.call.caller)}</div><div class="caller-line">“${esc(p.call.line)}”</div></div>
      <div class="timer" id="tm">0:00</div></div>
    <div class="bubbles" id="hb"></div>
    <div class="outcome off" id="oc">${ICON.check}<span>${esc(p.call.outcome)}</span></div>
  </div></div>`;
}

function servicePage(p) {
  const isLead = p.mode === "lead";
  const c = p.calc;
  const sliders = c.reactivation ? [
      ["c1", `Old leads in your CRM`, c.missed, 50, 5000, 50, ""],
      ["c2", c.leakLabel, 60, 10, 90, 5, "%"],
      ["c3", "Reached leads who book (%)", c.bookRate, 1, 30, 1, "%"],
      ["c4", c.valueLabel, c.value, 100, 20000, 100, "$"],
    ] : isLead ? [
      ["c1", "New leads per month", c.missed, 5, 400, 5, ""],
      ["c2", c.leakLabel, 30, 5, 80, 5, "%"],
      ["c3", "Leads who'd book if reached fast (%)", c.bookRate, 5, 60, 1, "%"],
      ["c4", c.valueLabel, c.value, 100, Math.max(20000, c.value * 3), 50, "$"],
    ] : [
      ["c1", "Missed calls per week", c.missed, 1, 60, 1, ""],
      ["c2", "Callers who'd have booked (%)", c.bookRate, 5, 90, 5, "%"],
      ["c4", c.valueLabel, c.value, 50, Math.max(10000, c.value * 3), 50, "$"],
    ];
  return `
  <section class="hero"><div class="wrap hero-grid">
    <div class="hero-copy">
      <span class="eyebrow">${esc(p.eyebrow)}</span>
      <h1>${p.h1.map(l => `<span>${esc(l)}</span>`).join("")}</h1>
      <p class="lede">${esc(p.sub)}</p>
      ${ctaRow()}
      ${trust()}
    </div>
    ${consoleCard(p)}
  </div></section>

  <section style="padding-top:0"><div class="wrap">
    <div class="sec-head"><span class="eyebrow">${c.reactivation ? "Why old leads go to waste" : `Where ${esc(p.industry.toLowerCase())} ${isLead ? "leads" : "calls"} leak`}</span><h2>${isLead ? "Leads aren't the problem. What happens next is." : "You're not losing calls. You're losing jobs."}</h2></div>
    <div class="leaks">${p.pains.map((x, i) => `<div class="leak"><span class="k">LEAK 0${i + 1}</span><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p></div>`).join("")}</div>
  </div></section>

  <section style="padding-top:0"><div class="wrap">
    <div class="sec-head"><span class="eyebrow">Listen in</span><h2>${c.reactivation ? "What a second call sounds like." : isLead ? "What happens three minutes after the form fill." : "What your callers actually hear."}</h2>
      <p class="lede">An example call, start to finish, and the summary that lands in your inbox when it ends.</p></div>
    <div class="listen">
      <div class="panel"><div class="panel-h"><span>Call transcript · example</span><button class="replay" id="replay" type="button">Replay</button></div><div class="transcript" id="tr"></div></div>
      <div class="panel"><div class="panel-h"><span>Call summary · sent to you</span></div>
        <dl class="summary" id="sum">${p.summary.map(([k, v]) => `<div class="sum-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        <p class="sum-foot">Every call is recorded and summarized. You can listen back to any of them.</p></div>
    </div>
  </div></section>

  <section style="padding-top:0"><div class="wrap">
    <div class="sec-head"><span class="eyebrow">${isLead ? "The system" : "You set the rules"}</span><h2>${esc(p.rulesTitle || "Every call goes exactly where you want it.")}</h2>
      <p class="lede">${isLead ? "Tap any line to see how it connects." : "You decide what counts as urgent and what gets booked. Tap a rule to see the route."}</p></div>
    <div class="rules" id="rules">${p.rules.map((r, i) => `<button type="button" class="rule${i === 0 ? " on" : ""}" aria-pressed="${i === 0}">
      <span class="t"><small>${isLead ? "Channel" : "When the caller says"}</small>${esc(r.trigger)}</span><span class="wire" aria-hidden="true"></span><span class="a"><small>${isLead ? "We handle" : "We do this"}</small>${esc(r.action)}</span></button>`).join("")}</div>
  </div></section>

  <section style="padding-top:0"><div class="wrap">
    <div class="sec-head"><span class="eyebrow">Run your numbers</span><h2>${c.reactivation ? "What's sitting in your old leads?" : isLead ? "What slow follow-up costs you." : "What missed calls cost you."}</h2>
      <p class="lede">Move the sliders to match your business. The starting values are only examples.</p></div>
    <div class="calc">
      <div class="panel sliders">${sliders.map(([id, lab, val, min, max, step, u]) => `<div class="sl"><label for="${id}">${esc(lab)} <output id="${id}o"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-u="${u}"></div>`).join("")}</div>
      <div class="result" aria-live="polite">
        <span class="lab">${c.reactivation ? "Revenue waiting in your CRM" : "Revenue walking out the door"}</span>
        <div class="big" id="big">$0 <small>${c.reactivation ? "potential" : "/ month"}</small></div>
        <div class="sub2"><div><b id="r1">0</b>${c.reactivation ? "people reached" : isLead ? "leads lost a month" : "lost jobs a month"}</div><div><b id="r2">$0</b>${c.reactivation ? "booked deals" : "a year"}</div></div>
        <p class="fine">An estimate from the numbers you enter. Your results depend on your market, pricing, and offer.</p>
      </div>
    </div>
  </div></section>

  ${howWeStart()}
  ${whyUs()}
  ${faqBlock(p)}
  ${relatedBlock(p)}
  ${band(p)}`;
}

function howWeStart() {
  const s = [
    ["We learn your business", "Your services, service area, customers, tools, and what a good job looks like to you."],
    ["We build it together", "Scripts, routing rules, and handoffs. You approve every word before we go live."],
    ["We run a small pilot", "Real calls and real results you can judge before committing to anything bigger."],
    ["We improve every week", "We review calls with you and keep tightening the script and the rules."],
  ];
  return `<section id="how" style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">How we start</span><h2>Live in days, proven in weeks.</h2></div>
    <div class="steps">${s.map(([h, d], i) => `<div class="step"><span class="n">0${i + 1}</span><h3>${h}</h3><p>${d}</p></div>`).join("")}</div></div></section>`;
}
function whyUs() {
  return `<section style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">Why Victory Sync</span><h2>A team you can actually see.</h2></div>
    <div class="why">
      <div><span class="k">Accountable</span><h3>One named owner</h3><p>Every client gets one person to call. Managed from Millstone, New Jersey.</p></div>
      <div><span class="k">Trained</span><h3>Agents who know you</h3><p>Our Cairo team is hired for clear English and trained on your business before taking a single call.</p></div>
      <div><span class="k">Visible</span><h3>Nothing hidden</h3><p>Listen to any call, read every summary, and check your numbers in your own dashboard.</p></div>
    </div></div></section>`;
}
function faqBlock(p) {
  return `<section id="faq" style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">Questions</span><h2>What owners ask us first.</h2></div>
    <div class="faq">${p.faqs.map((f, i) => `<details${i === 0 ? " open" : ""}><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}</div></div></section>`;
}
function relatedBlock(p) {
  return `<section style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">Keep reading</span><h2>Related services</h2></div>
    <div class="related">${p.related.map(s => bySlug[s]).filter(Boolean).map(r => `<a class="rel" href="#${r.slug}"><small>${r.kind === "compare" ? "Comparison" : esc(r.industry)}</small><b>${esc(shortName(r))}</b><span>Read more →</span></a>`).join("")}</div></div></section>`;
}
function band(p) {
  return `<section style="padding-top:0"><div class="wrap"><div class="band"><div><h2>${p.kind === "compare" ? "Not sure which fits? Let's look at your calls together." : "Let's look at your calls together."}</h2><p>A free consultation. We'll show you where calls and leads are slipping and how we'd fix it. No pressure.</p></div>
    <div style="display:grid;gap:10px;justify-items:start"><a class="btn btn-primary" href="${SITE.cta}" target="_blank" rel="noopener">${SITE.ctaLabel} ${ICON.arrow}</a><span class="phone-txt">${SITE.phone}</span></div></div></div></section>`;
}

function comparePage(p) {
  return `
  <section class="hero"><div class="wrap" style="position:relative;display:grid;gap:24px;max-width:900px">
    <span class="eyebrow">${esc(p.eyebrow)}</span>
    <h1>${p.h1.map(l => `<span>${esc(l)}</span>`).join("")}</h1>
    <p class="lede">${esc(p.sub)}</p>
    <div class="vs-hero"><div class="vs-card"><small>Option A</small><b>${esc(p.a)}</b></div><div class="vs-card b"><small>Option B</small><b>${esc(p.b)}</b></div></div>
  </div></section>
  <section style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">Side by side</span><h2>How they compare.</h2></div>
    <div class="table-wrap"><table><thead><tr><th scope="col"> </th><th scope="col">${esc(p.a)}</th><th scope="col">${esc(p.b)}</th></tr></thead>
    <tbody>${p.rows.map(r => `<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div></section>
  <section style="padding-top:0"><div class="wrap"><div class="sec-head"><span class="eyebrow">The honest answer</span><h2>When each one makes sense.</h2></div>
    <div class="when"><div class="panel"><h3>Choose ${esc(p.a)} when</h3><ul>${p.whenA.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="panel b"><h3>Choose ${esc(p.b)} when</h3><ul>${p.whenB.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div></div></section>
  ${faqBlock(p)}
  ${relatedBlock(p)}
  ${band(p)}`;
}

function bubble(m) { return `<div class="bub c-${m.who}"><small>${m.who === "agent" ? "Victory Sync agent" : "Caller"}</small>${esc(m.text)}</div>`; }

function runHero(p) {
  const st = $("#st"), stx = $("#stx"), tm = $("#tm"), hb = $("#hb"), oc = $("#oc"), caller = $("#caller");
  if (!st) return;
  const isLead = p.mode === "lead";
  const lines = p.transcript.slice(0, 3);
  if (reduced) {
    caller.classList.remove("ring"); st.className = "status done"; stx.textContent = "Handled"; tm.textContent = "2:41";
    hb.innerHTML = lines.map(bubble).join(""); oc.classList.remove("off"); return;
  }
  const cycle = () => {
    hb.innerHTML = ""; oc.classList.add("off"); caller.classList.add("ring"); st.className = "status"; stx.textContent = isLead ? "New lead" : "Ringing"; tm.textContent = "0:00";
    let sec = 0, tick;
    later(() => {
      caller.classList.remove("ring"); st.className = "status live"; stx.textContent = isLead ? "Calling back" : "Answered";
      tick = setInterval(() => { sec++; tm.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }, 1000);
      timers.push({ clear: () => clearInterval(tick) });
      let t = 400;
      lines.forEach(m => {
        later(() => { hb.insertAdjacentHTML("beforeend", m.who === "agent" ? '<div class="typing" data-t><i></i><i></i><i></i></div>' : ""); }, t);
        t += m.who === "agent" ? 900 : 300;
        later(() => { hb.querySelector("[data-t]")?.remove(); hb.insertAdjacentHTML("beforeend", bubble(m)); }, t);
        t += 1700;
      });
      later(() => { clearInterval(tick); oc.classList.remove("off"); st.className = "status done"; stx.textContent = "Handled"; }, t + 200);
      later(cycle, t + 5200);
    }, 1800);
  };
  cycle();
}

function runTranscript(p) {
  const tr = $("#tr"), rows = [...document.querySelectorAll(".sum-row")];
  if (!tr) return;
  const done = () => { tr.innerHTML = p.transcript.map(bubble).join(""); rows.forEach(r => r.classList.add("on")); };
  let started = false;
  const play = () => {
    started = true; tr.innerHTML = ""; rows.forEach(r => r.classList.remove("on"));
    if (reduced) return done();
    let t = 0;
    p.transcript.forEach((m, i) => { later(() => tr.insertAdjacentHTML("beforeend", bubble(m)), t); t += 1500; });
    rows.forEach((r, i) => later(() => r.classList.add("on"), t + i * 450));
  };
  done(); // complete at rest
  $("#replay").onclick = play;
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting && !started) { play(); io.disconnect(); } }, { threshold: .4 });
  io.observe(tr);
}

function runRules() {
  const btns = [...document.querySelectorAll(".rule")];
  btns.forEach(b => b.onclick = () => btns.forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); }));
}

function runCalc(p) {
  const v = id => +($("#" + id)?.value ?? 0);
  const upd = () => {
    document.querySelectorAll(".sl input").forEach(i => {
      const u = i.dataset.u; $("#" + i.id + "o").textContent = u === "$" ? money(i.value) : (+i.value).toLocaleString() + (u || "");
    });
    const c = p.calc;
    if (c.reactivation) {
      const reached = v("c1") * v("c2") / 100, deals = reached * v("c3") / 100;
      $("#big").innerHTML = money(deals * v("c4")) + " <small>potential</small>";
      $("#r1").textContent = Math.round(reached).toLocaleString(); $("#r2").textContent = Math.round(deals).toLocaleString();
    } else if (p.mode === "lead") {
      const lost = v("c1") * v("c2") / 100, jobs = lost * v("c3") / 100, m = jobs * v("c4");
      $("#big").innerHTML = money(m) + " <small>/ month</small>";
      $("#r1").textContent = Math.round(lost).toLocaleString(); $("#r2").textContent = money(m * 12);
    } else {
      const jobs = v("c1") * 4.33 * v("c2") / 100, m = jobs * v("c4");
      $("#big").innerHTML = money(m) + " <small>/ month</small>";
      $("#r1").textContent = Math.round(jobs).toLocaleString(); $("#r2").textContent = money(m * 12);
    }
  };
  document.querySelectorAll(".sl input").forEach(i => i.addEventListener("input", upd));
  upd();
}

function render(slug) {
  clearTimers();
  const p = bySlug[slug] || PAGES[0];
  document.title = p.title;
  $("#app").innerHTML = nav() + `<main>${p.kind === "compare" ? comparePage(p) : servicePage(p)}</main>
    <footer><div class="wrap"><span>© ${new Date().getFullYear()} Victory Sync LLC · Millstone, NJ</span><span class="mono">${SITE.phone}</span></div></footer>
    <div class="sticky"><a class="btn btn-primary" href="${SITE.cta}" target="_blank" rel="noopener">${SITE.ctaLabel}</a></div>`;
  $("#pagepick").value = p.slug;
  if (p.kind !== "compare") { runHero(p); runTranscript(p); runRules(); runCalc(p); }
  window.scrollTo(0, 0);
}

const pick = $("#pagepick");
pick.innerHTML = PAGES.map(p => `<option value="${p.slug}">/${p.slug}</option>`).join("");
pick.onchange = () => { location.hash = pick.value; };
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (bySlug[h]) render(h); });
render(location.hash.slice(1));
</script>
